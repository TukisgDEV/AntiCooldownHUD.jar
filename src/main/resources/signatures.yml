signatures:
  cooldownhud-combat:
    keybind: key.cooldown_hud.open
    first:
      key: activity.module.auto_mace.name
      values: ['AutoMace', 'Авто-булава (AutoMace)']
    second:
      key: activity.module.auto_totem.name
      values: ['AutoTotem', 'Авто-тотем (AutoTotem)']
  cooldownhud-keybind:
    keybind: key.cooldown_hud.open
    require-translations: false
    first:
      key: activity.module.auto_mace.name
      values: ['AutoMace', 'Авто-булава (AutoMace)']
    second:
      key: activity.module.auto_totem.name
      values: ['AutoTotem', 'Авто-тотем (AutoTotem)']
  cooldownhud-legacy:
    keybind: key.cooldown_hud.open
    first:
      key: key.activity.open_gui
      values: ['Open CooldownHUD Menu', 'Открыть меню CooldownHUD']
    second:
      key: activity.setting.general.enable_hud
      values: ['Enable CooldownHUD HUD', 'Включить HUD CooldownHUD']
  cooldownhud-anchor-cart:
    keybind: key.cooldown_hud.open
    first:
      key: activity.module.auto_anchor.name
      values: ['AutoAnchor', 'Авто-якорь (AutoAnchor)']
    second:
      key: activity.module.auto_cart.name
      values: ['AutoCart', 'Авто-вагонетки (AutoCart)']
  cooldownhud-stun-pearl:
    keybind: key.cooldown_hud.open
    first:
      key: activity.module.auto_stun_slam.name
      values: ['AutoStunSlam', 'Авто Стан Слэм']
    second:
      key: activity.module.auto_pearl_catch.name
      values: ['AutoPearlCatch', 'Пёрл Кэтч (AutoPearlCatch)']
  cooldownhud-refill:
    keybind: key.cooldown_hud.open
    first:
      key: activity.module.hp_reaper.name
      values: ['HPReaper']
    second:
      key: activity.module.cart_refill.name
      values: ['CartRefill', 'Пополнение (CartRefill)']
  freecam-legacy:
    mod-name: Freecam
    action: KICK
    keybind: key.freecam.toggle
    first:
      key: key.freecam.playerControl
      values: ["Control Player", "Controle do jogador", "Controlla il giocatore", "Controlo do jogador", "Contrôler le joueur", "Kontrollera Spelare", "Kontroluj Gracza", "Oyuncuyu Kontrol Et", "Spieler Kontrollieren", "Керувати гравцем", "Управлять игроком", "هدایت بازیکن", "プレーヤーコントロール", "控制玩家"]
    second:
      key: key.freecam.tripodReset
      values: ["Redefinir tripé", "Reset Tripod", "Resetowanie Statywu", "Resetta treppiedi", "Réinitialiser le tripode", "Stativ zurücksetzen", "Tripodu Sıfırla", "Сбросить штатив", "Скинути штатив", "بازگشت دوربین سه‌پایه به تنظیم اولیه", "三脚のリセット", "重置三脚架", "重設三腳架"]
  freecam-modern:
    mod-name: Freecam
    action: KICK
    keybind: key.freecam.toggle
    first:
      key: key.freecam.controlPlayer.toggle
      values: ["Control Player", "Controlar Jogador", "Controlar Jugador", "Controlla il giocatore", "Contrôler le joueur", "Kontrollera Spelare", "Kontroluj Gracza", "Oyuncuyu Kontrol Et", "Spieler Kontrollieren", "Керувати гравцем", "Управлять игроком", "تحكم اللاعب", "هدایت بازیکن", "プレーヤーコントロール", "控制玩家"]
    second:
      key: key.freecam.tripod.reset
      values: ["Redefinir Tripé", "Reset Tripod", "Resetowanie Statywu", "Resetta treppiedi", "Restablecer Trípode", "Réinitialiser le tripode", "Stativ zurücksetzen", "Tripodu Sıfırla", "Återställ stativet", "Сбросить штатив", "Скинути штатив", "بازگشت دوربین سه‌پایه به تنظیم اولیه", "ضبت الترايبود", "三脚のリセット", "重置视角", "重設三腳架"]
